<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harbor-roboteer API</title>
  </head>
  <body>
    <!-- Relative URLs, so it also works when served under a path prefix.
         disable-telemetry: Redoc 3 otherwise reports usage to Redocly. -->

    <!-- Redoc 3 is an ES module, so it needs type="module" -->
    <script type="module" src="redoc.standalone.js"></script>
  </body>
