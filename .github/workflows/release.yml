name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # for uploading binaries to release
      packages: write # for ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
          cache: false # to avoid cache poisoning

      - name: Setup Ko Docker credentials
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -pv ~/.docker
          touch ~/.docker/config.json
          chmod 600 ~/.docker/config.json
          echo '{
            "auths": {
              "'"$registry"'": {
                "auth": "'"$(echo -n "${username}:${password}" | base64 -w0)"'"
              }
            }
          }' > ~/.docker/config.json

      - name: Run GoReleaser, but skip publish
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        with:
          version: "~> v2"
          args: release --clean --skip=publish --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser and publish
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup credentials
        if: always()
        run: |
          if [[ -f ~/.docker/config.json ]]; then
            shred -vu ~/.docker/config.json
          else
            echo "no ~/.docker/config.json file found"
          fi
          if [[ -f ~/.ssh/id_ed25519 ]]; then
            shred -vu ~/.ssh/id_ed25519
          else
            echo "no ~/.ssh/id_ed25519 file found"
          fi
