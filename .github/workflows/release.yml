name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # for uploading binaries to release
      packages: write # for ghcr.io
      attestations: write # for signing
      artifact-metadata: write # for signing
      id-token: write # for using GitHub IdP (when signing)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go
          cache: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
          cache_key_prefix: mise-v1-goreleaser

      - name: Setup Ko Docker credentials
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -pv ~/.docker
          touch ~/.docker/config.json
          chmod 600 ~/.docker/config.json
          echo '{
            "auths": {
              "'"$registry"'": {
                "auth": "'"$(echo -n "${username}:${password}" | base64 -w0)"'"
              }
            }
          }' > ~/.docker/config.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
            ${{ runner.os }}-go-

      - name: Run GoReleaser, but skip publish
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        with:
          version: "~> v2"
          args: release --clean --skip=publish --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser and publish
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            dist/harbor-roboteer_*.tar.gz
            dist/harbor-roboteer_*.zip
            dist/harbor-roboteer_*/*

      - name: Cleanup credentials
        if: always()
        run: |
          if [[ -f ~/.docker/config.json ]]; then
            shred -vu ~/.docker/config.json
          else
            echo "no ~/.docker/config.json file found"
          fi
          if [[ -f ~/.ssh/id_ed25519 ]]; then
            shred -vu ~/.ssh/id_ed25519
          else
            echo "no ~/.ssh/id_ed25519 file found"
          fi

  helm:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # for ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: helm
          cache: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]

      - name: Lint and package chart
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: |
          set -x
          helm lint ./helm/harbor-roboteer
          helm package ./helm/harbor-roboteer --version 0.0.0-snapshot --app-version v0.0.0

      - name: Login to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$PASSWORD" | helm registry login ghcr.io --username "$USERNAME" --password-stdin

      - name: Package and release chart
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -x
          helm package ./helm/harbor-roboteer --version "${VERSION#v}" --app-version "$VERSION"
          helm push "./harbor-roboteer-${VERSION#v}.tgz" oci://ghcr.io/RiskIdent
