name: govulncheck

on:
  schedule:
    - cron: 0 8 * * 1 # 08:00 on mondays
  workflow_dispatch: # allow for triggering manually
  pull_request:
    paths:
      - .github/issue_govulncheck_template.md
      - .github/workflows/govulncheck.yml

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    name: Run govulncheck
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
          cache_key_prefix: mise-v1-govulncheck

      - name: Run govulncheck
        id: govulncheck
        run: |
          echo "govulncheck<<GOVULNCHECK_OUTPUT" >> "$GITHUB_OUTPUT"
          set +e # don't exit on error
          govulncheck ./... 2>&1 | tee --append "$GITHUB_OUTPUT"
          exit_status=$?
          echo "GOVULNCHECK_OUTPUT" >> "$GITHUB_OUTPUT"
          exit $exit_status
        shell: bash

      - name: Create GitHub issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        if: ${{ !cancelled() && steps.govulncheck.conclusion == 'failure' && github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVULNCHECK_OUTPUT: ${{ steps.govulncheck.outputs.govulncheck }}
          ACTION_FULL_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          filename: .github/issue_govulncheck_template.md
          update_existing: true
