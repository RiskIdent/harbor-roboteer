# Example config file

x-my-extensions: extensions are allowed, see https://docs.docker.com/reference/compose-file/extension/

known_claims: [repository, repository_owner, environment]

# Who may exchange a token at all. A token must match every claim of at least one identity.
# First valid match is used. Structure your identities from most-specific to least-specific.
identities:
  - { repository_owner: acme, repository: "acme/{repo}", environment: harbor }
  - { repository: acme/deploy-tools, environment: harbor }
  - { repository: acme/harbor-bootstrap, environment: harbor }
  - { repository: acme/image-scanner, environment: harbor }
  - { repository_owner: acme, repository: "acme/{repo}" }

# Project permissions. All matching grants add up; nothing denies.
projects:
  roles:
    pull: { repository: [list, read, pull], artifact: [list, read] }
    push:
      { repository: [list, read, pull, push], artifact: [list, read, create] }

  grants:
    own_project_pull:
      projects: ["{repository_owner}-{repo}"]
      roles: [pull]

    own_project_push:
      when: { environment: harbor }
      projects: ["{repository_owner}-{repo}"]
      roles: [push]

    deploy_tools_reads_shared:
      when: { repository: acme/deploy-tools }
      projects: [acme-shared]
      roles: [pull]
      permissions: { accessory: [list] }

# Grants on all projects, including ones created later ("Cover all projects" in Harbor).
all_projects:
  grants:
    image_scanner_reads_all:
      when: { repository: acme/image-scanner }
      roles: [pull]

# System permissions. All matching grants add up; nothing denies.
system:
  roles:
    project_creator: { project: [create], label: [create, update] }

  grants:
    bootstrap_creates_projects:
      when: { repository: acme/harbor-bootstrap }
      roles: [project_creator]
