# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1 # @schema type: integer; minimum: 0

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image: # @schema skipProperties; $ref: ./schema-utils.yaml#/definitions/image
  repository: ghcr.io/RiskIdent/harbor-roboteer
  pullPolicy: IfNotPresent
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: [] # @schema $ref: ./schema-utils.yaml#/definitions/imagePullSecrets
nameOverride: ""
fullnameOverride: ""

# Labels added to all resources created by this chart.
commonLabels: {} # @schema additionalProperties: {type: string}
  # team: platform

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  create: true
  automount: true
  annotations: {} # @schema additionalProperties: {type: string}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {} # @schema additionalProperties: {type: string}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {} # @schema additionalProperties: {type: string}

# Pod-level security settings. Defaults satisfy the "restricted" Pod Security Standard.
podSecurityContext: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security settings.
securityContext: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP # @schema enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080 # @schema type: integer; minimum: 1; maximum: 65535

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {} # @schema additionalProperties: {type: string}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: harbor-roboteer.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.networking.v1.IngressTLS
    # - secretName: harbor-roboteer-tls
    #   hosts:
    #     - harbor-roboteer.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {} # @schema additionalProperties: {type: string}
  # Which Gateways this Route is attached to.
  parentRefs: # @schema skipProperties; $ref: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json#/properties/spec/properties/parentRefs
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames: # @schema skipProperties; $ref: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json#/properties/spec/properties/hostnames
    - harbor-roboteer.local
  # List of rules and filters applied.
  rules: # @schema skipProperties; $ref: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json#/properties/spec/properties/rules
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# This restricts network traffic to the pods, more information can be found here: https://kubernetes.io/docs/concepts/services-networking/network-policies/
# Requires a CNI that enforces NetworkPolicy.
networkPolicy:
  # NetworkPolicy enabled.
  enabled: true
  # Peers allowed to reach the http port. Empty allows any source.
  ingressFrom: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyPeer
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  # Egress rules. Empty leaves egress unrestricted.
  egress: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyEgressRule
    # - ports:
    #     - port: 53
    #       protocol: UDP
    #     - port: 53
    #       protocol: TCP
    # - ports:
    #     - port: 443
    #       protocol: TCP

resources: {} # @schema $ref: ./schema-utils.yaml#/definitions/resources
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Probe
  httpGet:
    path: /health
    port: http
readinessProbe: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Probe
  httpGet:
    path: /health
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1 # @schema type: integer; minimum: 1
  maxReplicas: 100 # @schema type: integer; minimum: 1
  targetCPUUtilizationPercentage: 80 # @schema type: integer; minimum: 1
  # targetMemoryUtilizationPercentage: 80

# Log level of the app, passed as --log-level.
logLevel: info # @schema enum:[debug, info, warn, error]

