# -- Number of harbor-roboteer replicas.
replicaCount: 1 # @schema type: integer; minimum: 0

# @schema description: Container image settings.
image: # @schema skipProperties; $ref: ./schema-utils.yaml#/definitions/image
  # -- Image repository.
  repository: ghcr.io/riskident/harbor-roboteer
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Secrets for pulling an image from a private repository.
imagePullSecrets: [] # @schema $ref: ./schema-utils.yaml#/definitions/imagePullSecrets
# -- Override the chart name.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

# -- Labels added to all resources created by this chart.
commonLabels: {} # @schema additionalProperties: {type: string}
  # team: platform

# @schema description: Service account settings.
serviceAccount:
  # -- Create a service account.
  create: true
  # -- Automount the service account token.
  automount: true
  # -- Annotations to add to the ServiceAccount.
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Service account name. When empty and create is true, the chart generates a name.
  name: ""

# -- Annotations to add to Pods.
podAnnotations: {} # @schema additionalProperties: {type: string}
# -- Labels to add to Pods.
podLabels: {} # @schema additionalProperties: {type: string}

# -- Annotations to add to the Deployment.
deploymentAnnotations: {} # @schema additionalProperties: {type: string}
# -- Labels to add to the Deployment.
deploymentLabels: {} # @schema additionalProperties: {type: string}

# -- Pod-level security settings. Defaults satisfy the "restricted" Pod Security Standard.
podSecurityContext: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security settings. Defaults satisfy the "restricted" Pod Security Standard.
securityContext: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# @schema description: Kubernetes Service settings.
service:
  # -- Kubernetes Service type.
  type: ClusterIP # @schema enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
  # -- Kubernetes Service port.
  port: 8080 # @schema type: integer; minimum: 1; maximum: 65535

# @schema description: Ingress settings.
ingress:
  # -- Enable Ingress.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Annotations to add to the Ingress.
  annotations: {} # @schema additionalProperties: {type: string}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress host and path rules.
  hosts:
    - host: harbor-roboteer.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration.
  tls: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.networking.v1.IngressTLS
    # - secretName: harbor-roboteer-tls
    #   hosts:
    #     - harbor-roboteer.local

# @schema description: Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and a suitable controller installed in the cluster
# (see the [Gateway API guide](https://gateway-api.sigs.k8s.io/guides/)).
httpRoute:
  # -- Enable HTTPRoute.
  enabled: false
  # -- HTTPRoute annotations.
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Gateways this Route is attached to.
  parentRefs: # @schema skipProperties; $ref: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json#/properties/spec/properties/parentRefs
    - name: gateway
      sectionName: http
      # namespace: default
  # -- Hostnames matched by the HTTP request.
  hostnames: # @schema skipProperties; $ref: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json#/properties/spec/properties/hostnames
    - harbor-roboteer.local
  # -- Rules and filters applied to the HTTPRoute.
  rules: # @schema skipProperties; $ref: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json#/properties/spec/properties/rules
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# @schema description: Restrict network traffic to the Pods. Requires a CNI that enforces NetworkPolicy.
networkPolicy:
  # -- Enable NetworkPolicy.
  enabled: true
  # -- Peers allowed to reach the HTTP port. Empty allows any source.
  ingressFrom: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyPeer
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  # -- Peers allowed to reach the metrics port. Empty allows any source.
  metricsFrom: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyPeer
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: monitoring
  # -- Egress rules for the server and cleanup Pods. Empty leaves egress unrestricted.
  egress: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.networking.v1.NetworkPolicyEgressRule
    # - ports:
    #     - port: 53
    #       protocol: UDP
    #     - port: 53
    #       protocol: TCP
    # - ports:
    #     - port: 443
    #       protocol: TCP

# -- Resource requests and limits for the server container.
resources: {} # @schema $ref: ./schema-utils.yaml#/definitions/resources
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe settings.
livenessProbe: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Probe
  httpGet:
    path: /api/roboteer/v1/health
    port: http
# -- Readiness probe settings.
readinessProbe: # @schema skipProperties; $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Probe
  httpGet:
    path: /api/roboteer/v1/health
    port: http

# @schema description: Horizontal Pod Autoscaler settings.
autoscaling:
  # -- Enable horizontal pod autoscaling.
  enabled: false
  # -- Minimum number of replicas.
  minReplicas: 1 # @schema type: integer; minimum: 1
  # -- Maximum number of replicas.
  maxReplicas: 100 # @schema type: integer; minimum: 1
  # -- Target average CPU utilization percentage.
  targetCPUUtilizationPercentage: 80 # @schema type: integer; minimum: 1
  # targetMemoryUtilizationPercentage: 80

# -- Prometheus metrics settings. Metrics are served at /metrics.
metrics:
  # -- Enable the metrics listener and expose it through a separate ClusterIP Service.
  enabled: false
  # -- Metrics server port, passed as --metrics-addr.
  port: 9090 # @schema type: integer; minimum: 1; maximum: 65535
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor. Requires its CRDs.
    enabled: false
    # -- Extra labels, e.g. to match the Prometheus serviceMonitorSelector.
    labels: {} # @schema additionalProperties: {type: string}
    # -- Scrape interval. Empty uses the Prometheus default.
    interval: ""

# @schema description: Settings are propagated using the OpenTelemetry environment variable specification
# https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
# https://opentelemetry.io/docs/specs/otel/protocol/exporter/
tracing:
  # -- Enables tracing in config and addition of OTLP environment variables.
  enabled: false
  # -- Tracing exporter.
  exporter: otlp # @schema enum: [otlp, zipkin, console, none]
  otlp:
    # -- OTLP exporter endpoint.
    endpoint: http://otel-collector-collector.opentelemetry.svc.cluster.local:4317
    # -- OTLP protocol.
    protocol: grpc # @schema enum: [grpc, http/protobuf, http/json]
    # -- OTLP request compression.
    compression: none # @schema enum: [none, gzip]

# @schema description: CronJob that runs "harbor-roboteer cleanup" to delete expired robot accounts created by harbor-roboteer.
# It uses the same image, env, envFrom, logLevel, service account and scheduling settings as the server.
cleanup:
  # -- Enable the cleanup CronJob.
  enabled: true
  # -- Cron schedule. See [Cron schedule syntax](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#schedule-syntax).
  schedule: "0 * * * *"
  # -- Resource requests and limits for the cleanup container.
  resources: {} # @schema $ref: ./schema-utils.yaml#/definitions/resources

  # -- Annotations to add to the CronJob.
  cronjobAnnotations: {} # @schema additionalProperties: {type: string}
  # -- Labels to add to the CronJob.
  cronjobLabels: {} # @schema additionalProperties: {type: string}
  # -- Annotations to add to the Job.
  jobAnnotations: {} # @schema additionalProperties: {type: string}
  # -- Labels to add to the Job.
  jobLabels: {} # @schema additionalProperties: {type: string}

# -- Jsonnet config mapping token claims to Harbor permissions, see roboteer.jsonnet in the repo.
# Stored in a ConfigMap and passed as --config. Set it from a file with:
#   helm install ... --set-file config=roboteer.jsonnet
# The default rejects every token.
config: |
  function(claims) []

# -- Name of an existing ConfigMap to use instead of "config". It must have the key "roboteer.jsonnet".
# Pods are not restarted when it changes.
existingConfigMap: ""

# @schema description: Map of flag name to value. An empty string or null will omit the flag.
flags:
  # -- Log level of the app.
  log-level: info # @schema nullable; enum:[debug, info, warn, error, ""]; default: info
  # -- Log format of the app.
  log-format: json # @schema nullable; enum:[json, text, ""]; default: json
  # -- Harbor URL.
  harbor-url: "" # @schema nullable; examples:[https://harbor.example.com, http://harbor-core]
  # -- Harbor username.
  harbor-username: admin # @schema nullable
  # -- OIDC audience.
  oidc-audience: harbor-roboteer # @schema nullable; default: harbor-roboteer
  # -- OIDC issuer URL.
  oidc-issuer: "" # @schema nullable; examples:[https://token.actions.githubusercontent.com, https://github-enterprise.example.com/_services/token]
  # -- Robot account time to live.
  robot-ttl: 1h # @schema nullable; default: 1h

# -- Extra command-line arguments.
args: [] # @schema item: string
  # - --oidc-audience=harbor-roboteer

# -- Environment variables for the server and cleanup containers.
env: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.EnvVar
  # - name: ROBOTEER_HARBOR_URL
  #   value: https://harbor.example.com
  # - name: ROBOTEER_HARBOR_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: harbor-roboteer
  #       key: password
  # - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #   value: http://otel-collector:4318

# -- Load all keys of a Secret or ConfigMap as environment variables.
envFrom: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.EnvFromSource
  # - secretRef:
  #     name: harbor-roboteer

# -- Additional volumes on the output Deployment.
volumes: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Volume
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# -- Additional volume mounts on the output Deployment.
volumeMounts: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.VolumeMount
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

# -- Node labels for pod assignment.
nodeSelector: {} # @schema additionalProperties: {type: string}

# -- Tolerations for pod assignment.
tolerations: [] # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Toleration

# -- Affinity rules for pod assignment.
affinity: {} # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Affinity
