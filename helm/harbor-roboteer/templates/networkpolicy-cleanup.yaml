{{- if and .Values.networkPolicy.enabled .Values.cleanup.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "harbor-roboteer.cleanupFullname" . }}
  labels:
    {{- include "harbor-roboteer.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
spec:
  podSelector:
    matchLabels:
      {{- include "harbor-roboteer.cleanupSelectorLabels" . | nindent 6 }}
  # cleanup pods serve nothing, so all ingress is denied
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
